# Бесплатный запуск завода на GitHub Actions (публичный репозиторий: минуты бесплатны).
# Цикл каждые 10 минут. Состояние (factory.db) коммитится обратно в репозиторий.
name: tgfactory

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # каждые 10 мин, не на :00 — GitHub в пиковые минуты теряет запуски; окно слота 150 мин
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Опубликовать следующий пост сейчас (all / ru_marketing / uz_ielts / br_deals / пусто)"
        required: false
        default: ""
      recover_items:
        description: "yes = вернуть в очередь сырьё, сгоревшее из-за сбоев модели"
        required: false
        default: ""
      publish_count:
        description: "Сколько постов на канал публиковать вне очереди (1–15)"
        required: false
        default: "1"
      quiz_now:
        description: "Викторина сейчас (all / ru_marketing / uz_ielts)"
        required: false
        default: ""
      make_logos:
        description: "yes = нарисовать варианты логотипов каналов (папка logos/)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tgfactory
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ vars.DRY_RUN || '1' }}
      DB_PATH: factory.db
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      TG_BOT_RU: ${{ secrets.TG_BOT_RU || secrets.MBARU_POSTER_BOT }}
      TG_CHANNEL_RU: ${{ secrets.TG_CHANNEL_RU }}
      TG_BOT_UZ: ${{ secrets.TG_BOT_UZ || secrets.MBAUZ_POSTER_BOT }}
      TG_CHANNEL_UZ: ${{ secrets.TG_CHANNEL_UZ }}
      TG_BOT_BR: ${{ secrets.TG_BOT_BR || secrets.MBABR_POSTER_BOT }}
      TG_CHANNEL_BR: ${{ secrets.TG_CHANNEL_BR }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                     # всегда свежий main с последним factory.db (а не коммит момента запуска)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Вернуть сырьё в очередь
        if: ${{ github.event.inputs.recover_items == 'yes' }}
        run: python -m factory recover-items
      - name: Логотипы каналов
        if: ${{ github.event.inputs.make_logos == 'yes' }}
        run: python -m factory logos
      - name: Стартовые посты (однократно)
        run: python -m factory import-seed
      - name: Цикл завода
        run: python -m factory run
      - name: Публикация вне расписания
        if: ${{ github.event.inputs.publish_now != '' }}
        run: |
          if [ "${{ github.event.inputs.publish_now }}" = "all" ]; then
            python -m factory publish-now --count "${{ github.event.inputs.publish_count || 1 }}"
          else
            python -m factory publish-now "${{ github.event.inputs.publish_now }}" --count "${{ github.event.inputs.publish_count || 1 }}"
          fi
      - name: Викторина вне расписания
        if: ${{ github.event.inputs.quiz_now != '' }}
        run: |
          if [ "${{ github.event.inputs.quiz_now }}" = "all" ]; then
            python -m factory quiz-now
          else
            python -m factory quiz-now "${{ github.event.inputs.quiz_now }}"
          fi
      - name: Статус
        if: always()
        run: python -m factory status
      - name: Сохранить состояние
        if: always()                    # память сохраняем даже после ошибки — иначе будут дубли постов
        run: |
          git config user.name "tgfactory-bot"
          git config user.email "tgfactory-bot@users.noreply.github.com"
          git add -f factory.db
          [ -d logos ] && git add -f logos || true
          git diff --cached --quiet || git commit -m "state [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            # кто-то (загрузка файлов через сайт) успел закоммитить — подтягиваем, наша база главнее
            git pull --rebase -X theirs origin main || { git checkout --theirs factory.db; git add factory.db; GIT_EDITOR=true git rebase --continue; }
          done
          exit 1
