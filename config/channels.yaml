# Конфиг каналов. Один код — три канала. Меняется без правки кода.
# Токены и ключи НЕ здесь, а в .env (см. .env.example).

channels:

  ru_marketing:
    enabled: true
    title: "Маркетинг для малого бизнеса"
    language: ru
    timezone: Europe/Moscow
    bot_token_env: TG_BOT_RU            # имя переменной в .env
    channel_id_env: TG_CHANNEL_RU       # @username или -100...
    already_published: ["Взлом Bitget", "выбрать канал в Telegram для рекламы"]   # вышли 26.09, память потерялась — не повторять
    approval: false                     # публикуем без ручного одобрения
    slots: ["09:10", "12:40", "16:20", "19:30"]   # время публикаций (часовой пояс канала)
    queue_target: 6                     # сколько готовых постов держать в очереди
    prompt: prompts/ru_marketing.md
    image:
      provider: gemini
      aspect: "4:3"
      style: >-
        Scroll-stopping, eye-catching image for a Telegram post about marketing and small business.
        One bold, surprising visual metaphor of the post's main idea as a single strong focal object,
        glossy 3D render style, dramatic lighting, high contrast, vivid saturated colors
        (electric orange, deep navy, hot accents), dynamic diagonal composition, a sense of tension or emotion,
        clean uncluttered background so it pops on a phone screen. Purely visual: absolutely no text, no letters, no words, no numbers,
        no captions or labels anywhere in the image. No logos, no brand names, no real people.
    mix:                                # доля типов постов
      trending: 0.4                     # хайп: горячие темы дня → вывод для бизнеса
      rss_digest: 0.3
      evergreen: 0.3
    trending:
      max_age_hours: 36                 # старше — не берём, хайп протух
      feeds:
        - https://trends.google.com/trending/rss?geo=RU
        - https://trends.google.com/trending/rss?geo=US
      stop_words: [полит, выбор, госдум, кремл, путин, зеленск, украин, всу, " сво ", фронт, войн, воен,
        обстрел, дрон, беспилот, ракет, теракт, погиб, гибел, убит, убий, жертв, катастроф, крушен, авари,
        арест, задержан, суд над, приговор, митинг, протест, оппозиц, мобилизац, санкци, религ, церк, мечет,
        наркот, самоубий, сальмонел, отравлен, ставки на, прогноз на матч, букмекер, казино,
        politic, election, war , military, killed, dead, shooting, attack, terror, trump, putin, ukraine, israel, gaza]
    rss:
      - https://www.sostav.ru/rss
      - https://www.cossa.ru/rss/
      - https://rb.ru/feeds/all/
      - https://vc.ru/rss/all
    keywords: [маркетинг, реклам, продаж, клиент, бренд, маркетплейс, smm, telegram, контент, лид, воронк, crm, малый бизнес, предпринимател]
    evergreen_topics:
      - чек-лист запуска рекламы для малого бизнеса
      - как посчитать стоимость клиента (CAC) на пальцах
      - 5 ошибок в карточке товара на маркетплейсе
      - как написать оффер, который читают
      - разбор воронки продаж для локального бизнеса
      - как работать с отзывами
      - контент-план на неделю для малого бизнеса
      - как выбрать канал для посева в Telegram

  uz_ielts:
    enabled: true
    title: "IELTS va ingliz tili har kuni"
    language: uz
    timezone: Asia/Tashkent
    bot_token_env: TG_BOT_UZ
    channel_id_env: TG_CHANNEL_UZ
    already_published: ["Sayohat haqidagi Cue Card"]   # вышел 26.09 — не повторять
    approval: false                     # по решению владельца: публикуем без ручного одобрения (как RU и BR)
    approval_timeout_min: 240           # без ответа — пост не выходит
    slots: ["08:30", "13:00", "19:00"]
    queue_target: 6
    prompt: prompts/uz_ielts.md
    image:
      provider: gemini
      aspect: "4:3"
      style: >-
        Scroll-stopping, eye-catching image for an IELTS English learning post aimed at young people.
        One bold, fun visual metaphor of the post topic as a single strong focal object, glossy 3D render
        or vibrant pop-art style, bright saturated colors (turquoise, magenta, sunny yellow), dramatic lighting,
        dynamic composition, energetic and modern, clean background so it pops on a phone screen.
        Purely visual:
        absolutely no text, no letters, no words, no numbers anywhere in the image. No logos, no real people.
    mix:
      trending: 0.4                     # хайп: новость дня → английские слова и мини-текст для IELTS
      evergreen: 0.6
    trending:
      max_age_hours: 36
      feeds:
        - https://trends.google.com/trending/rss?geo=UZ
        - https://kun.uz/news/rss
      stop_words: [siyosat, saylov, prezident, putin, ukrain, rossiya, urush, harbiy, hujum, terakt, halok,
        o'ldi, oʻldi, qotil, jinoyat, qamoq, sud, hibs, din , masjid, namoz, narkot, o'z joniga, oʻz joniga,
        полит, выбор, путин, украин, войн, погиб, убий, арест, суд, религ, ставки на, прогноз на матч, букмекер,
        politic, election, war , killed, attack, terror]
    evergreen_topics:
      - "Kun so'zi: 5 ta IELTS akademik so'z, misollar bilan"
      - "Speaking Part 1: savol va namunaviy javob (Band 7)"
      - "Writing Task 2: kirish qismi uchun shablon"
      - "Grammatika: Present Perfect vs Past Simple"
      - "Listening: eng ko'p uchraydigan xatolar"
      - "Reading: True/False/Not Given strategiyasi"
      - "Collocations: 'make' va 'do' bilan"
      - "Mini test: 5 ta savol, javoblar pastda"
      - "Writing Task 1: grafikni tasvirlash iboralari"
      - "Speaking Part 2: cue card namunasi"

  br_deals:
    enabled: false                      # пауза до подключения партнёрки Shopee (решение владельца 26.09)
    title: "Achados da Casa"
    language: pt
    timezone: America/Sao_Paulo
    bot_token_env: TG_BOT_BR
    channel_id_env: TG_CHANNEL_BR
    already_published: ["Gaveta bagunçada nunca mais"]   # вышел 26.09 — не повторять
    approval: false
    slots: ["09:00", "13:00", "19:00"]     # до ключей Shopee — 3 поста в день из стартовых; потом до 7
    queue_target: 10
    prompt: prompts/br_deals.md
    image:
      provider: source                  # фото товара из Shopee
      fallback: gemini                  # если фото нет (стартовые советы) — рисуем
      aspect: "4:3"
      style: >-
        Eye-catching, bright lifestyle photo of a tidy Brazilian home related to the post topic,
        strong focal object, vivid colors, warm sunlight, high contrast, realistic. No text, no brand logos, no people's faces.
    disclosure: "#publi"                # метка рекламы по гиду CONAR — в каждом посте с партнёрской ссылкой
    mix:
      shopee_offers: 1.0
    shopee:
      keywords: [organizador, cozinha, limpeza, banheiro, utensilios, decoracao, cama mesa banho, lavanderia]
      min_discount_pct: 20              # минимальная скидка по данным Shopee
      min_rating: 4.5
      min_sales: 50
      max_price_brl: 300
      # защита от фейковых скидок: цена не выше медианы за N дней × (1 - min_real_drop)
      history_days: 30
      min_real_drop: 0.10
      require_history: false            # первые 30 дней истории нет — не блокируем
